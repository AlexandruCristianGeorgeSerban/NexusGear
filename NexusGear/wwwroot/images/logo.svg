<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gradiente cromatice extrase din slide-uri -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B2E" />
      <stop offset="100%" stop-color="#070C15" />
    </linearGradient>

    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A3" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="keycapTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2B45" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>

    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Filtru de strălucire neon (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Carcasă exterioară Dark Slate cu colțuri curbate -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#badgeBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- 2. Rețea discretă de fundal (PCB Matrix Traces) -->
  <g stroke="#38BDF8" stroke-width="0.75" opacity="0.12">
    <line x1="24" y1="14" x2="24" y2="114" />
    <line x1="104" y1="14" x2="104" y2="114" />
    <line x1="14" y1="24" x2="114" y2="24" />
    <line x1="14" y1="104" x2="114" y2="104" />
    <line x1="44" y1="8" x2="44" y2="24" />
    <line x1="84" y1="8" x2="84" y2="24" />
  </g>

  <!-- 3. Paranteze HUD tehnice la colțuri -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M 12 26 V 16 H 26" />
    <path d="M 102 16 H 116 V 26" />
    <path d="M 12 102 V 112 H 26" />
    <path d="M 102 112 H 116 V 102" />
  </g>

  <!-- 4. Inel tehnic exterior (Gear & Nexus Orbit) -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#neonMint)" stroke-width="1" stroke-dasharray="3 6" opacity="0.45" />

  <!-- Noduri cardinale pe orbită (Puncte de contact switch/periferice) -->
  <circle cx="64" cy="20" r="2.2" fill="#00E5A3" />
  <circle cx="64" cy="108" r="2.2" fill="#00E5A3" />
  <circle cx="20" cy="64" r="2.2" fill="#38BDF8" />
  <circle cx="108" cy="64" r="2.2" fill="#38BDF8" />

  <!-- 5. Tasta mecanică centrală (Profil 2.5D Keycap Bevel) -->
  <!-- Baza tastei -->
  <rect x="29" y="29" width="70" height="70" rx="18" fill="url(#metalBevel)" stroke="#334155" stroke-width="1" />
  <!-- Suprafața concavă interioară a tastei -->
  <rect x="34" y="34" width="60" height="60" rx="14" fill="url(#keycapTop)" stroke="url(#neonMint)" stroke-width="1.2" stroke-opacity="0.85" />

  <!-- 6. Mecanism Switch MX discret în spatele simbolului -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.25">
    <line x1="64" y1="44" x2="64" y2="84" />
    <line x1="44" y1="64" x2="84" y2="64" />
    <circle cx="64" cy="64" r="8" fill="none" />
  </g>

  <!-- 7. Simbolul central: Monograma "N" futuristă (Glow activ) -->
  <g filter="url(#neonGlow)">
    <path d="M 47 79 V 49 L 55.5 49 L 72.5 74 V 49 L 81 49 V 79 L 72.5 79 L 55.5 54 V 79 Z" 
          fill="url(#neonMint)" />
    <!-- Lamă interioară de reflexie albă pentru aspect neon -->
    <path d="M 57.5 54 L 72.5 76" 
          stroke="#FFFFFF" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          opacity="0.8" />
  </g>

  <!-- 8. Detalii tehnice micro: Indicatori LED de stare -->
  <g transform="translate(0, 0)">
    <circle cx="54" cy="118" r="1.8" fill="#00E5A3" />  <!-- Status: Online / Test Mode -->
    <circle cx="64" cy="118" r="1.8" fill="#38BDF8" />  <!-- Status: Sync / API -->
    <circle cx="74" cy="118" r="1.8" fill="#1E293B" stroke="#475569" stroke-width="0.8" /> <!-- Standby -->
  </g>

  <!-- Micro-text industrial -->
  <text x="64" y="16" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'SF Mono', monospace" 
        font-size="5.5" 
        font-weight="700" 
        letter-spacing="2" 
        fill="#64748B">NEXUS // 2026</text>
</svg>
